<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Passion Fruit Cake | Glaze & Tech</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pink: #f43484; 
            --text: #1a1a1a;
            --light-grey: #fff;
            /* On définit les variables de police pour une maintenance facile */
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        body {
            font-family: var(--font-main);
            margin: 0;
            background: #fff;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        /* NAVIGATION MINIMALISTE */
        nav {
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text);
            font-size: 11px;
            letter-spacing: 0.15em; /* Espacement plus moderne */
            text-transform: uppercase;
            font-weight: 700;
        }

        /* GRID PRINCIPALE */
        .product-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 0vh;
            align-items: center;
        }

        /* CÔTÉ TEXTE */
        .info-section {
            padding: 0 10% 0 15%;
        }

        .category-tag {
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 20px;
            display: block;
            font-weight: 700;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: clamp(40px, 5vw, 64px); /* Taille fluide */
            font-weight: 700;
            margin: 0 0 10px 0;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .vegan-tag {
            font-family: var(--font-serif);
            font-style: italic; /* Passage en italique pour le chic */
            font-size: 24px;
            color: var(--pink); /* Couleur accentuée pour le (v) */
            margin-bottom: 30px;
            display: block;
        }

        .description {
            font-family: var(--font-main);
            font-size: 16px;
            line-height: 1.7;
            color: #444;
            max-width: 450px;
            margin-bottom: 40px;
            font-weight: 400;
        }

        /* LE BOUTON ROSE */
        .order-btn {
            font-family: var(--font-main);
            background: var(--pink);
            color: white;
            border: none;
            padding: 20px 60px;
            border-radius: 100px; /* Plus arrondi */
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .order-btn:hover {
            background: #d4206b;
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(244, 52, 132, 0.2);
        }

        /* CÔTÉ IMAGE */
        .image-section {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--light-grey);
        }

        .product-image {
            width: 75%;
            max-width: 600px;
            transition: transform 0.8s ease;
        }
        
        .product-image:hover {
            transform: scale(1.05);
        }

        /* FOOTER INFOS */
        .details-footer {
            padding: 100px 15% 80px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 50px;
            border-top: 1px solid #f0f0f0;
        }

        .detail-item h4 {
            font-family: var(--font-main);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 20px;
            color: var(--text);
            font-weight: 700;
        }

        .detail-item p {
            font-family: var(--font-main);
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
            color: #666;
            font-weight: 400;
        }

        @media (max-width: 900px) {
            .product-container { grid-template-columns: 1fr; }
            .info-section { padding: 50px 30px; order: 2; text-align: center; }
            .description { margin-left: auto; margin-right: auto; }
            .image-section { height: 400px; order: 1; }
            .details-footer { grid-template-columns: 1fr; padding: 50px 30px; gap: 30px; }
        }
        /* --- FOOTER RESPONSIVE OPTIMISÉ --- */
.site-footer {
    background-color: #f43484; /* Ton rose exact */
    color: #ffffff;
    padding: 80px 0 40px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    margin-top: 50px;
}

.footer-grid {
    display: grid;
    grid-template-columns: 1.2fr 0.8fr 1fr 1.2fr;
    gap: 40px;
    align-items: start;
    margin-bottom: 60px;
}

.footer-logo .logo-text {
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: -1px;
    display: block;
    color: #fff;
}

.footer-logo .logo-subtext {
    font-size: 10px;
    letter-spacing: 2px;
    opacity: 0.8;
    color: #fff;
    text-transform: uppercase;
}

.footer-tagline {
    font-size: 14px;
    margin: 20px 0;
    line-height: 1.5;
    max-width: 300px;
}

.footer-heading {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 25px;
    position: relative;
    padding-bottom: 10px;
    color: #fff;
    text-transform: uppercase;
}

.footer-heading::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 30px;
    height: 2px;
    background: #fff;
}

.footer-links { list-style: none; padding: 0; }
.footer-links li { margin-bottom: 12px; }
.footer-links a { 
    color: #fff; 
    text-decoration: none; 
    font-size: 14px; 
    display: flex; 
    align-items: center; 
    gap: 8px; 
    transition: 0.3s;
}
.footer-links a:hover { opacity: 0.7; transform: translateX(5px); }

.info-item { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; font-size: 14px; }
.info-item span { background: rgba(255,255,255,0.2); padding: 6px; border-radius: 50%; font-size: 18px; }

/* Newsletter - Style Pill */
.newsletter-group {
    display: flex;
    background: #fff;
    border-radius: 50px;
    padding: 5px;
    margin-top: 15px;
    max-width: 100%;
}
.news-input {
    flex: 1;
    border: none;
    padding: 10px 15px;
    border-radius: 50px;
    outline: none;
    font-size: 14px;
    width: 100%;
}
.news-btn {
    background: #f43484;
    color: #fff;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
}
.news-btn:hover { background: #1A1A1A; }

/* Réseaux Sociaux */
.footer-socials { display: flex; gap: 12px; margin-top: 20px; }
.social-link {
    width: 38px;
    height: 38px;
    background: #fff;
    color: #f43484 !important;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: 0.3s;
}
.social-link:hover { transform: translateY(-3px); background: #1A1A1A; color: #fff !important; }

/* Bas de page */
.footer-bottom {
    border-top: 1px solid rgba(255,255,255,0.2);
    padding-top: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
}
.footer-legal a { color: #fff; text-decoration: none; margin-left: 15px; }

/* --- MEDIA QUERIES (Le coeur du Responsive) --- */

@media (max-width: 1024px) {
    .footer-grid {
        grid-template-columns: 1fr 1fr; /* 2 colonnes sur tablette */
        gap: 50px;
    }
}

@media (max-width: 768px) {
    .site-footer { padding: 60px 0 30px; }
    
    .footer-grid {
        grid-template-columns: 1fr; /* 1 colonne sur mobile */
        text-align: center;
        gap: 40px;
    }

    .footer-tagline { margin: 20px auto; }
    
    .footer-heading::after {
        left: 50%;
        transform: translateX(-50%); /* Centre le trait sous le titre */
    }

    .footer-links a, .info-item {
        justify-content: center; /* Centre les liens et infos de contact */
    }

    .footer-socials {
        justify-content: center;
    }

    .newsletter-group {
        max-width: 350px;
        margin: 15px auto;
    }

    .footer-bottom {
        flex-direction: column; /* Empile le copyright et les mentions légales */
        gap: 20px;
        text-align: center;
    }

    .footer-legal a {
        margin: 0 10px;
    }
}
/* --- STYLE LOGO IMAGE --- */

    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="back-btn">← Retour</a>
    </nav>

    <main class="product-container">
        
        <section class="info-section">
            <span class="category-tag">Donut de Saison</span>
            <h1>Passion Fruit Cake</h1>
            <span class="vegan-tag">(v)</span>

            <p class="description">
                Vivez une explosion de soleil à chaque bouchée. Notre donut signature à la vanille, nappé d'un glaçage vibrant au fruit de la passion avec une pointe de piment de Cayenne pour le caractère. Surmonté d'éclats de cacao croquants.
            </p>

            <button class="order-btn">Commander</button>
        </section>

        <section class="image-section">
            <img src="image/d8.jpg" alt="Passion Fruit Donut" class="product-image">
        </section>

    </main>

    

 
</body>
</html>
